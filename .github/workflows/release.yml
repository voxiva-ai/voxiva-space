name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./native -> target"
      - run: npm ci
      - run: npm run electron:check
      - run: cargo build --manifest-path native/Cargo.toml
      - run: npm run electron:app-smoke

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./native -> target"
      - run: npm ci
      - name: Ensure tag and app versions match
        shell: bash
        run: node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) { console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${expected}`); process.exit(1); }'
      - run: npm run build
      - run: cargo build --release --manifest-path native/Cargo.toml
      - run: npx electron-builder --publish never
      - name: Remove duplicate builder diagnostics
        shell: pwsh
        run: Remove-Item -LiteralPath release/builder-debug.yml -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: voxiva-space-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: voxiva-space-windows-x64
          path: artifacts/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: voxiva-space-macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: voxiva-space-macos-x64
          path: artifacts/macos-x64
      - run: node scripts/merge-electron-update-manifests.cjs artifacts/macos-arm64/latest-mac.yml artifacts/macos-arm64/latest-mac.yml artifacts/macos-x64/latest-mac.yml
      - run: rm artifacts/macos-x64/latest-mac.yml
      - uses: softprops/action-gh-release@v2
        with:
          name: Voxiva Space ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/windows-x64/*
            artifacts/macos-arm64/*
            artifacts/macos-x64/*
