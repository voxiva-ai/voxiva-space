[package]
name = "voxiva-space"
version = "0.2.0"
description = "Voxiva Space — desktop workspace for terminals, files, and AI agents"
authors = ["Voxiva"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "voxiva_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "image-png", "devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
rfd = "0.15"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
